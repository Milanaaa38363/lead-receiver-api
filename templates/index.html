<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121214; 
            color: #e4e4e7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card { 
            background-color: #18181b; 
            border: 1px solid #27272a; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        .form-control, .form-select {
            background-color: #27272a;
            border: 1px solid #3f3f46;
            color: #f4f4f5;
        }
        .form-control:focus, .form-select:focus {
            background-color: #27272a;
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-primary { 
            background: linear-gradient(135deg, #6366f1, #4f46e5); 
            border: none; 
            border-radius: 8px; 
            padding: 10px 20px; 
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca); 
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #e4e4e7;
        }
        .table-light {
            --bs-table-bg: #27272a;
            --bs-table-color: #a1a1aa;
        }
        
        /* Анимация тёмно-зеленого неонового свечения */
        @keyframes highlightAnimation {
            0% { background-color: rgba(16, 185, 129, 0.35); }
            50% { background-color: rgba(16, 185, 129, 0.2); }
            100% { background-color: transparent; }
        }

        .highlight-row {
            animation: highlightAnimation 3s ease-in-out;
            border-left: 4px solid #10b981;
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <h2 class="fw-bold mb-4 text-center text-light">CRM — Управление лидами</h2>
        
        <div class="row g-4">
            <!-- Форма отправки -->
            <div class="col-md-5">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-light">Новая заявка</h5>
                    <form id="leadForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary">Имя клиента</label>
                            <input type="text" id="name" class="form-control" placeholder="Иван Иванов" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary">Телефон</label>
                            <input type="text" id="phone" class="form-control" placeholder="+7 707 123 4567" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary">Источник</label>
                            <select id="source" class="form-select">
                                <option value="Instagram">Instagram</option>
                                <option value="Website">Сайт</option>
                                <option value="Telegram">Telegram</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Создать лид</button>
                    </form>
                    <div id="alertBox" class="mt-3"></div>
                </div>
            </div>

            <!-- Таблица сделок -->
            <div class="col-md-7">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-light">Активные сделки</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID Сделки</th>
                                    <th>Клиент</th>
                                    <th>Телефон</th>
                                    <th>Статус</th>
                                </tr>
                            </thead>
                            <tbody id="dealsTable">
                                <tr><td colspan="4" class="text-center text-muted">Загрузка данных...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadDeals(highlightDealId = null) {
            const res = await fetch('/deals/');
            const deals = await res.json();
            const table = document.getElementById('dealsTable');
            table.innerHTML = '';
            
            if (!deals || deals.length === 0) {
                table.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Сделок пока нет</td></tr>';
                return;
            }

            if (highlightDealId) {
                deals.sort((a, b) => (String(a.id) === String(highlightDealId) ? -1 : String(b.id) === String(highlightDealId) ? 1 : 0));
            }

            deals.forEach(d => {
                const isTarget = highlightDealId && String(d.id) === String(highlightDealId);
                const rowClass = isTarget ? 'highlight-row' : '';

                table.innerHTML += `
                    <tr id="deal-row-${d.id}" class="${rowClass}">
                        <td class="fw-bold text-indigo" style="color: #818cf8;">#${String(d.id).slice(0, 8)}</td>
                        <td>${d.client ? d.client.name : '—'}</td>
                        <td class="text-secondary">${d.client ? d.client.phone_normalized : '—'}</td>
                        <td><span class="badge bg-emerald-subtle text-emerald border border-emerald px-2 py-1" style="background: rgba(16, 185, 129, 0.1); color: #34d399; border-color: rgba(16, 185, 129, 0.3) !important;">${d.status}</span></td>
                    </tr>
                `;
            });
        }

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            
            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                source: document.getElementById('source').value
            };

            const res = await fetch('/leads/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                alertBox.innerHTML = `<div class="alert alert-success py-2 mb-0" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3);">${data.message}</div>`;
                document.getElementById('leadForm').reset();
                loadDeals(data.deal_id);
            } else {
                alertBox.innerHTML = `<div class="alert alert-danger py-2 mb-0" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3);">${data.detail[0]?.msg || 'Ошибка ввода'}</div>`;
            }
        });

        loadDeals();
    </script>
</body>
</html>
